services:
  postgres:
    image: postgres:18
    container_name: hcpcs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hcpcs_db
      POSTGRES_USER: hcpcs_user
      POSTGRES_PASSWORD: hcpcs_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: